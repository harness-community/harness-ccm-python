[project]
name = "harness-ccm-python"
version = "0.1.0"
description = "Harness CCM helpers for cost categories, perspectives, and budget provisioning"
readme = "README.md"
authors = [
    { name = "tyler", email = "tyler.mapp@harness.io" }
]
requires-python = ">=3.13"
dependencies = [
    "requests",
    "PyYAML",
    "openpyxl",
]

[project.scripts]
harness-ccm-python = "harness_ccm_python:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"harness.py" = "harness.py"
"generate_from_buckets.py" = "generate_from_buckets.py"
"seed_testbed.py" = "seed_testbed.py"
"teardown_testbed.py" = "teardown_testbed.py"
"provision" = "provision"
"budgets" = "budgets"
"perspectives" = "perspectives"
"costcategories" = "costcategories"

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
extend-exclude = ["example_*.py"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.hatch.build.targets.sdist]
include = [
    "src/harness_ccm_python",
    "harness.py",
    "generate_from_buckets.py",
    "seed_testbed.py",
    "teardown_testbed.py",
    "provision",
    "budgets",
    "perspectives",
    "costcategories",
    "examples",
    "tests",
    "requirements.txt",
    "README.md",
]
